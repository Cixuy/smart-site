<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="300" fill="#ffffff"/>

  <rect x="28" y="40" width="342" height="52" rx="8" fill="#F7F6F2" stroke="#D3D1C7"/>
