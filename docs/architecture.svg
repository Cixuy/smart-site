  <text x="470" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">REST /api · WebSocket · 告警状态机</text>

  <rect x="648" y="128" width="184" height="52" rx="8" fill="#EEF3F8" stroke="#B5D4F4"/>
